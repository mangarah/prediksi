{{define "content"}}
<section>
  <h1 class="text-3xl font-medium tracking-tight text-slate-900">Akun saya</h1>
  <p class="text-sm text-slate-500 font-medium mt-1">Ganti password akun yang sedang dipakai.</p>
</section>

<section class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
  <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6">
    <dl class="space-y-3 text-sm">
      <div><dt class="text-xs text-slate-500">Nama</dt><dd class="mt-1 font-medium text-slate-900">{{.User.Name}}</dd></div>
      <div><dt class="text-xs text-slate-500">Email</dt><dd class="mt-1 font-medium text-slate-900">{{.User.Email}}</dd></div>
      <div><dt class="text-xs text-slate-500">Peran</dt><dd class="mt-1 font-medium text-slate-900 capitalize">{{.User.Role}}</dd></div>
      <div><dt class="text-xs text-slate-500">Cabang</dt><dd class="mt-1 font-medium text-slate-900">{{.User.Branch}}</dd></div>
    </dl>
  </div>

  <form method="post" action="/akun/password" class="lg:col-span-2 bg-white rounded-3xl border border-slate-100 shadow-sm p-6 space-y-4">
    <h2 class="text-base font-semibold text-slate-900">Ganti password</h2>
    <div>
      <label class="text-xs font-semibold text-slate-600 mb-1 block" for="current">Password sekarang</label>
      <input id="current" name="current" type="password" required class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm" />
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="text-xs font-semibold text-slate-600 mb-1 block" for="new">Password baru</label>
        <input id="new" name="password" type="password" required minlength="8" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm" />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-600 mb-1 block" for="confirm">Ulangi password baru</label>
        <input id="confirm" name="confirm" type="password" required minlength="8" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm" />
      </div>
    </div>
    <p class="text-xs text-slate-500">Minimal 8 karakter. Perangkat lain akan diminta login ulang.</p>
    <button type="submit" class="px-4 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 transition-colors">Simpan password</button>
  </form>
</section>
{{end}}
