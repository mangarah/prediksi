{{define "content"}}
<section>
  <h1 class="text-3xl font-medium tracking-tight text-slate-900">Pengguna</h1>
  <p class="text-sm text-slate-500 font-medium mt-1">Kelola akun staf dan cabang.</p>
</section>

<section class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
  <div class="space-y-6">
    <form method="post" action="/pengguna" class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 space-y-4">
      <h2 class="text-base font-semibold text-slate-900">Tambah pengguna</h2>
      <div>
        <label class="text-xs font-semibold text-slate-600 mb-1 block" for="u-name">Nama</label>
        <input id="u-name" name="name" required class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm" />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-600 mb-1 block" for="u-email">Email</label>
        <input id="u-email" name="email" type="email" required class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm" />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-600 mb-1 block" for="u-pass">Password awal</label>
        <input id="u-pass" name="password" type="text" required minlength="8" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm" />
        <p class="text-xs text-slate-500 mt-1">Minimal 8 karakter.</p>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1 block" for="u-role">Peran</label>
          <select id="u-role" name="role" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm">
            <option value="kasir">Kasir</option>
            <option value="buyer">Buyer</option>
            <option value="manajer">Manajer</option>
            <option value="owner">Owner</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1 block" for="u-branch">Cabang</label>
          <select id="u-branch" name="branch" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm">
            <option value="0">Semua cabang</option>
            {{range .Data.Branches}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
          </select>
        </div>
      </div>
      <button type="submit" class="w-full py-2.5 rounded-xl bg-teal-700 text-white text-sm font-semibold hover:bg-teal-800 transition-colors">Tambah pengguna</button>
    </form>

    <form method="post" action="/pengguna/cabang" class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 space-y-3">
      <h2 class="text-base font-semibold text-slate-900">Tambah cabang</h2>
      <input name="name" required placeholder="Nama cabang" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm" />
      <button type="submit" class="w-full py-2.5 rounded-xl border border-slate-200 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors">Tambah cabang</button>
    </form>
  </div>

  <div class="lg:col-span-2 space-y-3">
    {{range .Data.Users}}
    {{$uid := .BranchID}}
    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-5">
      <form method="post" action="/pengguna/{{.ID}}" class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
        <div class="sm:col-span-3">
          <label class="text-xs font-semibold text-slate-600 mb-1 block">Nama</label>
          <input name="name" required value="{{.Name}}" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm" />
        </div>
        <div class="sm:col-span-3">
          <label class="text-xs font-semibold text-slate-600 mb-1 block">Email</label>
          <input name="email" type="email" required value="{{.Email}}" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm" />
        </div>
        <div class="sm:col-span-3">
          <label class="text-xs font-semibold text-slate-600 mb-1 block">Peran</label>
          <select name="role" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm">
            <option value="kasir" {{if eq .Role "kasir"}}selected{{end}}>Kasir</option>
            <option value="buyer" {{if eq .Role "buyer"}}selected{{end}}>Buyer</option>
            <option value="manajer" {{if eq .Role "manajer"}}selected{{end}}>Manajer</option>
            <option value="owner" {{if eq .Role "owner"}}selected{{end}}>Owner</option>
          </select>
        </div>
        <div class="sm:col-span-3">
          <label class="text-xs font-semibold text-slate-600 mb-1 block">Cabang</label>
          <select name="branch" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm">
            <option value="0">Semua</option>
            {{range $.Data.Branches}}<option value="{{.ID}}" {{if eq .ID $uid}}selected{{end}}>{{.Name}}</option>{{end}}
          </select>
        </div>
        <label class="sm:col-span-12 flex items-center gap-2 text-xs font-medium text-slate-600">
          <input type="checkbox" name="active" value="1" {{if .Active}}checked{{end}} class="rounded border-slate-300 text-teal-700 focus:ring-teal-500" /> Akun aktif
        </label>
        <div class="sm:col-span-12 flex justify-end">
          <button type="submit" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800 transition-colors">Simpan</button>
        </div>
      </form>
      <form method="post" action="/pengguna/{{.ID}}/password" class="mt-3 pt-3 border-t border-slate-100 flex flex-col sm:flex-row gap-2">
        <input name="password" type="text" required minlength="8" placeholder="Password baru (min. 8)" class="flex-1 rounded-xl border-slate-200 bg-slate-50 text-sm" />
        <button type="submit" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition-colors">Reset password</button>
      </form>
    </div>
    {{end}}
  </div>
</section>
{{end}}
