<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Label {{.Unit.Code}} — Prediksi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['"IBM Plex Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>
    body { font-variant-numeric: tabular-nums; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      .label { box-shadow: none !important; border: 1.5px solid #0f172a !important; }
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900 min-h-screen flex items-start justify-center p-6">
  <div class="w-full max-w-sm">
    <div class="no-print flex items-center justify-between mb-4">
      <a href="/dashboard" class="text-xs font-semibold text-slate-500 hover:text-slate-800">← Kembali</a>
      <button onclick="window.print()" class="px-4 py-2 rounded-2xl bg-slate-900 text-white text-xs font-semibold">Cetak label</button>
    </div>

    <div class="label bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <p class="text-xs font-semibold text-slate-500">Prediksi · {{.Unit.Branch}}</p>
          <p class="text-sm font-semibold mt-1 leading-tight">{{.Unit.Model}} {{.Unit.Variant}}</p>
          <p class="text-xs font-medium text-slate-500 mt-0.5">Grade {{.Unit.Grade}} · {{.Unit.AgeDays}} hari</p>
        </div>
        <div id="qr" class="shrink-0"></div>
      </div>
      <div class="mt-4 flex items-end justify-between border-t border-dashed border-slate-200 pt-3">
        <div>
          <p class="text-xs font-semibold text-slate-500">Kode</p>
          <p class="text-lg font-semibold tracking-tight">{{.Unit.Code}}</p>
        </div>
        <div class="text-right">
          <p class="text-xs font-semibold text-slate-500">Harga</p>
          <p class="text-xl font-semibold tracking-tight">{{rp .Unit.ListedPrice}}</p>
        </div>
      </div>
    </div>

    <p class="no-print text-xs font-medium text-slate-500 text-center mt-4">Tempel label ini di unit. QR berisi kode unit.</p>
  </div>

  <script>
    new QRCode(document.getElementById('qr'), {
      text: '{{.Unit.Code}}',
      width: 84,
      height: 84,
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
